# Local Postgres for development and tests (parity with Neon in production, see ADR-007).
# Credentials below are local-only dev values, not secrets.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vqm
      POSTGRES_PASSWORD: vqm
      POSTGRES_DB: vqm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vqm -d vqm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
